<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar clave | ConectBioSync</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='web.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">SEGURIDAD DE LA CUENTA</p>
    <h1>Cambiar clave</h1>
    <p class="muted">Ingresá tu clave actual y elegí una clave nueva para tu cuenta.</p>
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('change_password') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf }}">
      <label>Clave actual
        <input type="password" name="current_password" autocomplete="current-password" required autofocus>
      </label>
      <label>Nueva clave
        <input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required>
      </label>
      <label>Repetir nueva clave
        <input type="password" name="confirmation" minlength="12" maxlength="256" autocomplete="new-password" required>
      </label>
      <button class="primary full-width" type="submit">Guardar clave</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf }}">
      <button class="button-quiet full-width" type="submit">Cerrar sesión</button>
    </form>
  </main>
</body>
</html>
